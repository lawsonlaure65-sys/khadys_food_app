<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#3E2723" />
    
    <title>KHADY'S FOOD & EVENT</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/h1rgJJMb/1766933626062.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Great+Vibes&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
              script: ['Great Vibes', 'cursive'],
            },
            colors: {
              brand: {
                brown: '#3E2723',
                orange: '#FF6F00',
                gold: '#FFD700',
                cream: '#FFF8E1',
                light: '#FAFAFA'
              }
            },
            animation: {
              'wave': 'wave 2.5s infinite',
              'fade-in': 'fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
              'infinite-scroll': 'infiniteScroll 60s linear infinite',
              'zoom-dezoom': 'zoomRespiration 12s ease-in-out infinite',
              'pulse-gold': 'pulseGold 2s infinite',
              'bounce-subtle': 'bounceSubtle 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)',
            },
            keyframes: {
              wave: {
                '0%, 100%': { transform: 'rotate(0deg)' },
                '10%, 30%, 50%': { transform: 'rotate(14deg)' },
                '20%, 40%, 60%': { transform: 'rotate(-8deg)' },
              },
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              infiniteScroll: { 
                '0%': { transform: 'translateX(0)' }, 
                '100%': { transform: 'translateX(-50%)' } 
              },
              zoomRespiration: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.15)' },
              },
              pulseGold: {
                '0%, 100%': { boxShadow: '0 0 0 0 rgba(255, 215, 0, 0.6)' },
                '70%': { boxShadow: '0 0 0 15px rgba(255, 215, 0, 0)' },
              },
              bounceSubtle: {
                '0%': { transform: 'scale(1)' },
                '30%': { transform: 'scale(1.3) translateY(-10px)' },
                '100%': { transform: 'scale(1) translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      body {
        background-color: #FDFCFB;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .dark-glass {
        background: rgba(26, 15, 13, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
    </style>
  </head>
  <body class="text-[#3E2723] antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
